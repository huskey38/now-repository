<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>안녕하세요</title>
  <style>
    body {
      margin: 0;
      padding: 16px;
      background: #f7f7f7;
      font-family: "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    }
    h1 {
      text-align: center;
    }
    /* 5칸 2줄 */
    .gallery {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
      max-width: 900px;
      margin: 0 auto;
    }
    .item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .item img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 8px;
    }
    .item button {
      padding: 6px 12px;
      border: none;
      border-radius: 6px;
      background: #2f7de1;
      color: #fff;
      cursor: pointer;
    }
    .item button:hover {
      background: #1f5fb3;
    }
  </style>
</head>
<body>
  <h1>안녕하세요</h1>
  <div class="gallery" id="gallery"></div>

  <script>
    // 같은 폴더의 이미지 파일 10개 (파일 이름을 바꿔 쓰면 됩니다)
    const images = [
      'beach.webp', 'beach.webp', 'beach.webp', 'beach.webp', 'beach.webp',
      'beach.webp', 'beach.webp', 'beach.webp', 'beach.webp', 'beach.webp'
    ];

    const gallery = document.getElementById('gallery');
    images.forEach((src, i) => {
      const label = (i + 1) + '번';
      const item = document.createElement('div');
      item.className = 'item';

      const img = document.createElement('img');
      img.src = src;
      img.alt = (i + 1) + '번 이미지';

      const button = document.createElement('button');
      button.type = 'button';
      button.textContent = label;
      button.addEventListener('click', () => alert(label));

      item.append(img, button);
      gallery.appendChild(item);
    });
  </script>
</body>
</html>
